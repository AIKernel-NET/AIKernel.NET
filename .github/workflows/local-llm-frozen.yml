name: LocalLlm frozen package acceptance
on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run in this repository containing the local-llm-030-frozen artifact
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: local-llm-030-frozen
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: frozen-feed
      - name: Verify package hashes, locked restore and shared contracts
        run: python src/integrations/LocalLlm/verify_frozen.py --feed frozen-feed --results frozen-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-llm-contract-results
          path: |
            frozen-evidence/integration.trx
            frozen-evidence/verification.json
